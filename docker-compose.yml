# Local development stack (Phase 3): postgres, Lean judge, desk; workers + decomposer are opt-in.
# The review tool runs from source: `pnpm web:dev` (http://localhost:5173, proxies /api to the desk).
# web and indexer are added in later phases (see BUILD_PROMPT.md section 3).
#
#   JUDGE_FLAVOR=lite docker compose up -d desk            # postgres + judge + desk (no model calls)
#   JUDGE_FLAVOR=lite docker compose --profile agents up worker   # WORKER_COUNT agents: SPENDS API MONEY
# JUDGE_FLAVOR defaults to full (pinned Mathlib, ~7-8 GB): build that one in the cloud (docs/deploy.md).
name: hatchery

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_USER: hatchery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hatchery-dev-only}
      POSTGRES_DB: hatchery
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchery -d hatchery"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Builds the sandbox image the judge starts for every check, then exits after printing its version.
  lean-runner:
    build:
      context: .
      dockerfile: apps/judge/runner/Dockerfile
      args:
        FLAVOR: ${JUDGE_FLAVOR:-full}
    image: hatchery-lean-runner:${JUDGE_FLAVOR:-full}
    command: ["version"]
    network_mode: none
    restart: "no"

  judge:
    build:
      context: .
      dockerfile: apps/judge/Dockerfile
    image: hatchery-judge:dev
    depends_on:
      lean-runner:
        condition: service_completed_successfully
    environment:
      JUDGE_IMAGE: hatchery-lean-runner:${JUDGE_FLAVOR:-full}
      JUDGE_TIMEOUT_SECONDS: ${JUDGE_TIMEOUT_SECONDS:-300}
      JUDGE_MEMORY_MB: ${JUDGE_MEMORY_MB:-8192}
      JUDGE_CPUS: ${JUDGE_CPUS:-2}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-1}
      JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:-}
    volumes:
      # Needed to start sibling sandbox containers. Anything with this socket is root on the
      # Docker host: the judge service only ever runs trusted code. See docs/judge.md.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  desk:
    build:
      context: .
      dockerfile: apps/desk/Dockerfile
    image: hatchery-desk:dev
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hatchery:${POSTGRES_PASSWORD:-hatchery-dev-only}@postgres:5432/hatchery
      JUDGE_URL: http://judge:4100
      JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:-}
      DESK_WORKER_TOKEN: ${DESK_WORKER_TOKEN:-}
      MATHLIB_LEMMAS_ENABLED: ${MATHLIB_LEMMAS_ENABLED:-0}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-1800}
      AGENT_MAX_ATTEMPTS_PER_LEMMA: ${AGENT_MAX_ATTEMPTS_PER_LEMMA:-3}
      GLOBAL_DAILY_CAP_USD: ${GLOBAL_DAILY_CAP_USD:-100}
      RUNWAY_TARGET_DAYS: ${RUNWAY_TARGET_DAYS:-30}
      KILL_SWITCH: ${KILL_SWITCH:-0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Default: accepted proofs go to a throwaway clone inside the container. Writing to the real
      # checkout needs PROOF_COMMIT_MODE=commit AND HATCHERY_REAL_RUN=1 AND REPO_MOUNT_MODE=rw.
      PROOF_COMMIT_MODE: ${PROOF_COMMIT_MODE:-sandbox}
      HATCHERY_REAL_RUN: ${HATCHERY_REAL_RUN:-0}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
      # Server only (docs/deploy.md): push bot commits with a repo-scoped deploy key.
      PROOF_PUSH: ${PROOF_PUSH:-0}
      PROOF_PUSH_REMOTE: ${PROOF_PUSH_REMOTE:-origin}
      PROOF_PUSH_BRANCH: ${PROOF_PUSH_BRANCH:-main}
      GIT_SSH_COMMAND: ${GIT_SSH_COMMAND:-}
    # The desk writes and commits accepted proofs into the checkout, so it runs as the checkout's owner.
    user: "${HATCHERY_UID:-1000}:${HATCHERY_GID:-1000}"
    volumes:
      # The checkout, READ-ONLY unless a real run sets REPO_MOUNT_MODE=rw.
      - .:/repo:${REPO_MOUNT_MODE:-ro}
    ports:
      - "127.0.0.1:4200:4200"

  # Opt-in: `--profile agents`. Every model call costs money and is recorded in model_calls.
  worker:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: hatchery-worker:dev
    depends_on:
      desk:
        condition: service_started
    environment:
      DESK_URL: http://desk:4200
      DESK_WORKER_TOKEN: ${DESK_WORKER_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKER_COUNT: ${WORKER_COUNT:-2}
      AGENT_ID_PREFIX: ${AGENT_ID_PREFIX:-agent}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-20}
      AGENT_EFFORT: ${AGENT_EFFORT:-high}
      WORKER_MAX_RUN_USD: ${WORKER_MAX_RUN_USD:-0}
      KILL_SWITCH: ${KILL_SWITCH:-0}
    restart: "no"

  # Opt-in: `--profile agents`. Proposes statements; a human approves them in the review tool.
  decomposer:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: hatchery-worker:dev
    command: ["node", "--import", "tsx", "src/decomposer-main.ts"]
    depends_on:
      desk:
        condition: service_started
    environment:
      DESK_URL: http://desk:4200
      DESK_WORKER_TOKEN: ${DESK_WORKER_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      DECOMPOSER_INTERVAL_SECONDS: ${DECOMPOSER_INTERVAL_SECONDS:-3600}
      KILL_SWITCH: ${KILL_SWITCH:-0}
    restart: "no"

volumes:
  pgdata:
