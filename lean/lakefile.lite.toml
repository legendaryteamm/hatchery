# LITE flavor: Lean core only, no Mathlib. Used for judge development/tests.
# The runner Dockerfile swaps this in when FLAVOR=lite. Keep targets in sync with lakefile.toml.
name = "hatchery"
defaultTargets = ["Defs", "Statements", "Proofs", "judgecheck"]

[[lean_lib]]
name = "Defs"
globs = ["Defs.+"]

[[lean_lib]]
name = "Statements"
globs = ["Statements.+"]

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

[[lean_exe]]
name = "judgecheck"
root = "Judge.Main"
supportInterpreter = true
