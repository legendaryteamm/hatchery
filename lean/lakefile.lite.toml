# LITE flavor: Lean core only, no Mathlib. Used for judge development/tests.
# The runner Dockerfile swaps this in when FLAVOR=lite. Keep targets in sync with lakefile.toml.
name = "hatchery"
defaultTargets = ["DefsCore", "judgecheck"]

[[lean_lib]]
name = "DefsCore"
globs = ["Defs.Core.+"]



[[lean_exe]]
name = "judgecheck"
root = "Judge.Main"
supportInterpreter = true
